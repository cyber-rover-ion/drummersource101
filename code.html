<style>
    /* Physical 3D Rim and Drum Head Assembly */
    .drum-pad-wrapper {
      perspective: 700px;
      touch-action: manipulation;
    }
    
    .drum-pad-chassis {
      background: radial-gradient(circle at 45% 35%, #252733 0%, #171822 55%, #0d0e14 100%);
      box-shadow: 
        0 14px 28px -6px rgba(0, 0, 0, 0.95),
        0 4px 8px rgba(0, 0, 0, 0.7),
        inset 0 2px 3px rgba(255, 255, 255, 0.16),
        inset 0 -3px 6px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: transform 75ms cubic-bezier(0.1, 0.9, 0.2, 1), box-shadow 75ms ease;
      will-change: transform, box-shadow;
    }

    .drum-membrane {
      background: 
        radial-gradient(circle at 50% 50%, #1c1e29 0%, #14151e 58%, #090a0e 100%),
        repeating-radial-gradient(circle at center, transparent 0, transparent 4px, rgba(255, 255, 255, 0.02) 5px, transparent 6px);
      box-shadow: 
        inset 0 6px 14px rgba(0, 0, 0, 0.98),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 -2px 6px rgba(0, 0, 0, 0.6);
      transition: filter 70ms ease, background-color 70ms ease;
    }

    /* Fast Expanding Impact Ripple Ring */
    .drum-ripple {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 9999px;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.35);
      border: 2px solid currentColor;
      transition: transform 160ms cubic-bezier(0.1, 0.8, 0.25, 1), opacity 160ms ease-out;
    }

    .drum-ripple.active-ripple {
      opacity: 0.9;
      transform: scale(1.02);
      transition: none;
    }

    .drum-flash-highlight {
      opacity: 0;
      transition: opacity 140ms ease-out;
    }

    /* 3D Physical Depression Hits */
    .pad-pressed .drum-pad-chassis {
      transform: perspective(600px) translateZ(-9px) translateY(4px) scale(0.97) !important;
      box-shadow: 
        0 4px 10px rgba(0, 0, 0, 0.85),
        inset 0 3px 6px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
    }

    .pad-pressed .drum-flash-highlight {
      opacity: 0.45 !important;
      transition: none;
    }

    /* Color-specific glow accents on strike */
    .pad-cyan.pad-pressed .drum-membrane {
      box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.5), inset 0 6px 14px rgba(0, 0, 0, 0.9);
      border-color: rgba(0, 240, 255, 0.9) !important;
    }
    .pad-cyan.pad-pressed .pad-badge {
      box-shadow: 0 0 14px #00f0ff;
      background-color: #00f0ff;
      color: #002022 !important;
    }
    .pad-cyan.pad-pressed .drum-pad-chassis {
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.5), 0 4px 10px rgba(0, 0, 0, 0.9) !important;
    }

    .pad-pink.pad-pressed .drum-membrane {
      box-shadow: inset 0 0 25px rgba(255, 74, 141, 0.55), inset 0 6px 14px rgba(0, 0, 0, 0.9);
      border-color: rgba(255, 74, 141, 0.9) !important;
    }
    .pad-pink.pad-pressed .pad-badge {
      box-shadow: 0 0 14px #ff4a8d;
      background-color: #ff4a8d;
      color: #3f001a !important;
    }
    .pad-pink.pad-pressed .drum-pad-chassis {
      box-shadow: 0 0 24px rgba(255, 74, 141, 0.5), 0 4px 10px rgba(0, 0, 0, 0.9) !important;
    }

    .pad-amber.pad-pressed .drum-membrane {
      box-shadow: inset 0 0 25px rgba(255, 186, 38, 0.55), inset 0 6px 14px rgba(0, 0, 0, 0.9);
      border-color: rgba(255, 186, 38, 0.9) !important;
    }
    .pad-amber.pad-pressed .pad-badge {
      box-shadow: 0 0 14px #ffba26;
      background-color: #ffba26;
      color: #271900 !important;
    }
    .pad-amber.pad-pressed .drum-pad-chassis {
      box-shadow: 0 0 24px rgba(255, 186, 38, 0.5), 0 4px 10px rgba(0, 0, 0, 0.9) !important;
    }

    .pad-peach.pad-pressed .drum-membrane {
      box-shadow: inset 0 0 25px rgba(255, 222, 169, 0.55), inset 0 6px 14px rgba(0, 0, 0, 0.9);
      border-color: rgba(255, 222, 169, 0.9) !important;
    }
    .pad-peach.pad-pressed .pad-badge {

      background-color: #ffdea9;

<span class="material-symbols-outlined text-[16px]">speed</span>
<span>VELOCITY: HARD</span>

<!-- COMPLETE HIGH-FIDELITY WEB AUDIO DRUM ENGINE -->
<script>
  // Persistent Audio Context & Nodes
  let audioCtx = null;
  let masterGain = null;
  let distortionCurve = null;

  // Sample cache for external files
  const sampleBuffers = {};
  const sampleFiles = {
    'kick': 'sounds/kick.wav',
    'snare': 'sounds/snare.wav',
    'tom1': 'sounds/tom1.wav',
    'tom2': 'sounds/tom2.wav',
    'hihat': 'sounds/hihat.wav',
    'crash': 'sounds/crash.wav'
  };

  // Distortion curve generator for kick punch warmth
  function makeDistortionCurve(amount = 20) {
    const k = typeof amount === 'number' ? amount : 20;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
      const x = (i * 2) / n_samples - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();

      // Master volume bus
      masterGain = audioCtx.createGain();
      const currentVal = parseFloat(document.getElementById('master-volume').value) / 100;
      masterGain.gain.setValueAtTime(currentVal, audioCtx.currentTime);
      masterGain.connect(audioCtx.destination);

      distortionCurve = makeDistortionCurve(15);
      preloadSamples();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Sample buffer loader with seamless procedural synthesis fallback
  function preloadSamples() {
    Object.entries(sampleFiles).forEach(([name, path]) => {
      fetch(path)
        .then(res => {
          if (!res.ok) throw new Error('Not found');
          return res.arrayBuffer();
        })
        .then(buf => audioCtx.decodeAudioData(buf))
        .then(decoded => {
          sampleBuffers[name] = decoded;
        })
        .catch(() => {
          // File not present: silently fall back to synthetic engine
          sampleBuffers[name] = null;
        });
    });
  }

  // PROCEDURAL HIGH-FIDELITY SYNTHESIS VOICES

  // 1. KICK: Punchy pitch-drop (140Hz -> 35Hz in 0.08s) + transient click + soft saturation
  function synthKick(ctx, now) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const waveShaper = ctx.createWaveShaper();

    waveShaper.curve = distortionCurve;
    waveShaper.oversample = '2x';

    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.08);

    gain.gain.setValueAtTime(1.0, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

    // Click transient for attack snap
    const clickOsc = ctx.createOscillator();
    const clickGain = ctx.createGain();
    clickOsc.type = 'square';
    clickOsc.frequency.setValueAtTime(300, now);
    clickGain.gain.setValueAtTime(0.4, now);
    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

    clickOsc.connect(clickGain);
    clickGain.connect(masterGain);
    clickOsc.start(now);
    clickOsc.stop(now + 0.02);

    osc.connect(waveShaper);
    waveShaper.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + 0.38);
  }

  // 2. SNARE: Crisp white noise burst (highpassed 800Hz) + tone body (180Hz) + snappy decay
  function synthSnare(ctx, now) {
    // Body tone
    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(75, now + 0.12);

    oscGain.gain.setValueAtTime(0.7, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

    osc.connect(oscGain);
    oscGain.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.14);

    // Noise burst
    const length = Math.floor(ctx.sampleRate * 0.22);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.95;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(800, now);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.9, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(masterGain);

    noise.start(now);
    noise.stop(now + 0.22);
  }

  // 3 & 4. TOMS: Resonant pitch-dropped sines
  function synthTom(ctx, now, startFreq, endFreq, dropTime, decayTime) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(endFreq, now + dropTime);

    gain.gain.setValueAtTime(0.85, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + decayTime);

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + decayTime);
  }

  // 5. HI-HAT: Metallic bandpass filtered noise burst with razor-sharp 0.05s choke envelope
  function synthHiHat(ctx, now) {
    const length = Math.floor(ctx.sampleRate * 0.06);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const bpf = ctx.createBiquadFilter();
    bpf.type = 'bandpass';
    bpf.frequency.setValueAtTime(8500, now);
    bpf.Q.setValueAtTime(4.0, now);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.75, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    noise.connect(bpf);
    bpf.connect(gain);
    gain.connect(masterGain);

    noise.start(now);
    noise.stop(now + 0.06);
  }

  // 6. CRASH: Wide-spectrum shimmering metallic noise with natural 1.2s decay
  function synthCrash(ctx, now) {
    const length = Math.floor(ctx.sampleRate * 1.3);
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const hpf = ctx.createBiquadFilter();
    hpf.type = 'highpass';
    hpf.frequency.setValueAtTime(4200, now);

    const bpf = ctx.createBiquadFilter();
    bpf.type = 'bandpass';
    bpf.frequency.setValueAtTime(7500, now);
    bpf.Q.setValueAtTime(1.2, now);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.75, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

    noise.connect(hpf);
    hpf.connect(bpf);
    bpf.connect(gain);
    gain.connect(masterGain);

    noise.start(now);
    noise.stop(now + 1.25);
  }

  // Overlapping polyphonic sound trigger with sample or procedural fallback
  function playSound(type) {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    if (sampleBuffers[type]) {
      const src = ctx.createBufferSource();
      src.buffer = sampleBuffers[type];
      src.connect(masterGain);
      src.start(now);
    } else {
      switch (type) {
        case 'kick':
          synthKick(ctx, now);
          triggerVUMeter(0.95);
          break;
        case 'snare':
          synthSnare(ctx, now);
          triggerVUMeter(0.85);
          break;
        case 'tom1':
          synthTom(ctx, now, 180, 85, 0.15, 0.32);
          triggerVUMeter(0.7);
          break;
        case 'tom2':
          synthTom(ctx, now, 120, 55, 0.22, 0.38);
          triggerVUMeter(0.75);
          break;
        case 'hihat':
          synthHiHat(ctx, now);
          triggerVUMeter(0.5);
          break;
        case 'crash':
          synthCrash(ctx, now);
          triggerVUMeter(0.88);
          break;
      }
    }
  }

  // PHYSICAL 3D PAD ANIMATIONS & STRIKE ROUTER
  const padElements = {
    'A': document.getElementById('pad-A'),
    'S': document.getElementById('pad-S'),
    'D': document.getElementById('pad-D'),
    'J': document.getElementById('pad-J'),
    'K': document.getElementById('pad-K'),
    'L': document.getElementById('pad-L')
  };

  const keyToPad = {
    'A': 'pad-A',
    'S': 'pad-S',
    'D': 'pad-D',
    'J': 'pad-J',
    'K': 'pad-K',
    'L': 'pad-L'
  };

  const activeKeyStates = new Set();
  const padResetTimers = {};

  function triggerPad(keyChar) {
    const padId = keyToPad[keyChar];
    if (!padId) return;
    const pad = document.getElementById(padId);
    if (!pad) return;

    const note = pad.getAttribute('data-note');
    playSound(note);

    // Apply physical depressed state
    pad.classList.add('pad-pressed');

    // Trigger fast outward ripple ring
    const ripple = document.getElementById(`ripple-${keyChar}`);
    if (ripple) {
      ripple.classList.remove('active-ripple');
      void ripple.offsetWidth; // Force CSS reflow
      ripple.classList.add('active-ripple');
      setTimeout(() => {
        ripple.classList.remove('active-ripple');
      }, 160);
    }

    // Auto-return timer for pointer/keyboard hits
    if (padResetTimers[keyChar]) clearTimeout(padResetTimers[keyChar]);
    padResetTimers[keyChar] = setTimeout(() => {
      if (!activeKeyStates.has(keyChar)) {
        pad.classList.remove('pad-pressed');
      }
    }, 120);
  }

  function releasePad(keyChar) {
    activeKeyStates.delete(keyChar);
    const padId = keyToPad[keyChar];
    if (!padId) return;
    const pad = document.getElementById(padId);
    if (pad) {
      pad.classList.remove('pad-pressed');
    }
  }

  // POINTER & TOUCH EVENTS (with deduplication)
  document.querySelectorAll('.drum-pad').forEach(pad => {
    const key = pad.getAttribute('data-key');

    pad.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      getAudioContext();
      triggerPad(key);
    });

    pad.addEventListener('pointerup', (e) => {
      e.preventDefault();
      releasePad(key);
    });

    pad.addEventListener('pointerleave', () => {
      releasePad(key);
    });

    pad.addEventListener('pointercancel', () => {
      releasePad(key);
    });
  });

  // KEYBOARD CONTROLS (Case-insensitive, e.repeat filtered, Caps Lock safe)
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const key = e.key.toUpperCase();
    if (keyToPad[key]) {
      e.preventDefault();
      getAudioContext();
      activeKeyStates.add(key);
      triggerPad(key);
    }
  });

  window.addEventListener('keyup', (e) => {
    const key = e.key.toUpperCase();
    if (keyToPad[key]) {
      e.preventDefault();
      releasePad(key);
    }
  });

  // MASTER VOLUME SLIDER (smooth gain updates without cutting audio)
  const volumeSlider = document.getElementById('master-volume');
  const volumeReadout = document.getElementById('volume-readout');

  volumeSlider.addEventListener('input', (e) => {
    const val = parseInt(e.target.value, 10);
    volumeReadout.textContent = `${val}%`;
    if (masterGain && audioCtx) {
      masterGain.gain.setValueAtTime(val / 100, audioCtx.currentTime);
    }
  });

  // STEREO VU METER ANIMATION
  function triggerVUMeter(intensity) {
    const barsL = document.querySelectorAll('#meter-l .meter-bar');
    const barsR = document.querySelectorAll('#meter-r .meter-bar');
    const count = Math.min(barsL.length, Math.max(1, Math.ceil(intensity * barsL.length)));

    barsL.forEach((bar, idx) => {
      if (idx < count) {
        bar.classList.remove('opacity-20');
        bar.classList.add('opacity-100');
      } else {
        bar.classList.remove('opacity-100');
        bar.classList.add('opacity-20');
      }
    });

    barsR.forEach((bar, idx) => {
      if (idx < count) {
        bar.classList.remove('opacity-20');
        bar.classList.add('opacity-100');
      } else {
        bar.classList.remove('opacity-100');
        bar.classList.add('opacity-20');
      }
    });

    setTimeout(() => {
      barsL.forEach(bar => { bar.classList.remove('opacity-100'); bar.classList.add('opacity-20'); });
      barsR.forEach(bar => { bar.classList.remove('opacity-100'); bar.classList.add('opacity-20'); });
    }, 150);
  }

  // AUDIO INITIALIZATION BUTTON
  document.getElementById('audio-init-btn')?.addEventListener('click', () => {
    getAudioContext();
    const status = document.getElementById('engine-status');
    if (status) {
      status.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-primary-container shadow-[0_0_6px_#00f0ff]"></span> ONLINE`;
    }
  });
</script>
